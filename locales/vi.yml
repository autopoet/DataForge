about:
  content: >-
    # Về DataForge
    
    DataForge là một bàn làm việc dữ liệu dành cho nhà phát triển frontend: dán một mẩu dữ liệu lộn xộn, rồi định dạng, so sánh, chuyển đổi định dạng và tạo kiểu TypeScript — tất cả ở một nơi.
    
    Dự án này là sự phát triển thứ cấp của dự án mã nguồn mở IT-Tools (GPL-3.0). Nó giữ lại nền tảng kỹ thuật (Vue 3, TypeScript, Vite, Naive UI, kiểm thử và triển khai) trong khi tổ chức lại sản phẩm xoay quanh xử lý dữ liệu.
    
    ## Công nghệ
    
    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
