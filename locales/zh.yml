about:
  content: >-
    # 关于 DataForge

    DataForge 是给前端开发者的数据工作台：粘贴一份混乱的数据，格式化、对比、转换格式、生成 TypeScript 类型，一站式完成。

    本项目基于开源项目 IT-Tools（GPL-3.0）进行二次开发，保留其工程底座（Vue 3、TypeScript、Vite、Naive UI、测试与部署体系），围绕"数据处理"重新组织产品，并新增了 JSON 转 TypeScript 等能力。

    ## 功能

    - **数据工作台**：格式自动检测、多层编码 JSON 一键解码、格式化 / 压缩 / 转换（YAML / TOML / XML / CSV）、TypeScript 类型视图、文件导入导出、历史快照与对比。
    - **TypeScript 类型生成器**：从 JSON 推导嵌套 interface / type 声明，支持可选字段、字面量联合与命名冲突处理。
    - **专项工具**：JSON / XML / YAML 格式化、9 种格式转换、JSON 与文本对比、URL / Base64 / HTML 实体编码、JWT 解析、HTTP 状态码。

    ## 路线图

    - Phase 2：结构推导引擎 —— JSON Schema 推导与 Mock 数据生成，与类型生成器共用结构分析核心。
    - Phase 3：性能验证与打磨 —— 大数据场景优化与文档完善。

    ## 技术栈

    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
