about:
  content: >-
    # Про DataForge
    
    DataForge — це робочий стіл даних для фронтенд-розробників: вставте незрозумілі дані, відформатуйте їх, порівняйте, конвертуйте у потрібний формат і згенеруйте TypeScript-типи — все в одному місці.
    
    Цей проєкт є вторинною розробкою відкритого проєкту IT-Tools (GPL-3.0). Він зберігає інженерну основу (Vue 3, TypeScript, Vite, Naive UI, тестування та розгортання) і переорганізовує продукт навколо обробки даних.
    
    ## Технічний стек
    
    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
