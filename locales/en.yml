about:
  content: >-
    # About DataForge

    DataForge is a data workbench for frontend developers: paste a messy piece of data, then format, compare, convert formats and generate TypeScript types — all in one place.

    This project is a second development of the open-source project IT-Tools (GPL-3.0). It keeps its engineering foundation (Vue 3, TypeScript, Vite, Naive UI, testing and deployment setup) while reorganizing the product around data processing and adding new capabilities such as JSON to TypeScript generation.

    ## Features

    - **Data workbench**: automatic format detection, one-click decoding of layered JSON-encoded strings, format / minify / convert views (YAML / TOML / XML / CSV), a TypeScript type view, file import & export, and history snapshots with diff.
    - **TypeScript type generator**: derive nested interface / type declarations from JSON, with optional keys, literal unions and naming-collision handling.
    - **Dedicated tools**: JSON / XML / YAML formatting, nine format converters, JSON & text diff, URL / Base64 / HTML-entities encoding, JWT parser, and HTTP status codes.

    ## Roadmap

    - Phase 2: structure inference engine — JSON Schema inference and mock data generation, sharing the analysis core with the type generator.
    - Phase 3: performance validation and polish — large-input optimization and documentation.

    ## Tech stack

    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
