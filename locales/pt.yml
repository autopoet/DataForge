about:
  content: >-
    # Sobre o DataForge
    
    O DataForge é uma bancada de dados para desenvolvedores frontend: cole um dado bagunçado e formate, compare, converta o formato e gere tipos TypeScript — tudo em um só lugar.
    
    Este projeto é um desenvolvimento secundário do projeto open source IT-Tools (GPL-3.0). Ele mantém sua base de engenharia (Vue 3, TypeScript, Vite, Naive UI, testes e deploy) enquanto reorganiza o produto em torno do processamento de dados.
    
    ## Stack de tecnologia
    
    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
