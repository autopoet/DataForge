about:
  content: >-
    # Om DataForge
    
    DataForge er en dataverktøykasse for frontend-utviklere: lim inn et rotete datasett, og formater, sammenlign, konverter format og generer TypeScript-typer — alt på ett sted.
    
    Dette prosjektet er en videreutvikling av det åpne prosjektet IT-Tools (GPL-3.0). Det beholder den tekniske basen (Vue 3, TypeScript, Vite, Naive UI, testing og deploy) mens produktet er reorganisert rundt databehandling.
    
    ## Teknologistabel
    
    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
