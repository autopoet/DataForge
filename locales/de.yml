about:
  content: >-
    # Über DataForge
    
    DataForge ist eine Daten-Workbench für Frontend-Entwickler: Fügen Sie ein unübersichtliches Datenstück ein und formatieren, vergleichen und konvertieren Sie es und generieren Sie TypeScript-Typen — alles an einem Ort.
    
    Dieses Projekt ist eine Weiterentwicklung des Open-Source-Projekts IT-Tools (GPL-3.0). Es übernimmt dessen technische Grundlage (Vue 3, TypeScript, Vite, Naive UI, Test- und Deployment-Setup) und organisiert das Produkt neu rund um die Datenverarbeitung.
    
    ## Tech-Stack
    
    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
