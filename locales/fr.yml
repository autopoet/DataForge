about:
  content: >-
    # À propos de DataForge
    
    DataForge est un atelier de données pour les développeurs frontend : collez une donnée désordonnée, puis formatez-la, comparez-la, convertissez son format et générez des types TypeScript — le tout au même endroit.
    
    Ce projet est un développement secondaire du projet open source IT-Tools (GPL-3.0). Il conserve son socle technique (Vue 3, TypeScript, Vite, Naive UI, tests et déploiement) tout en réorganisant le produit autour du traitement des données.
    
    ## Stack technique
    
    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
