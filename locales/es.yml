about:
  content: >-
    # Acerca de DataForge
    
    DataForge es un banco de trabajo de datos para desarrolladores frontend: pega un dato desordenado y formatéalo, compáralo, conviértelo de formato y genera tipos TypeScript — todo en un solo lugar.
    
    Este proyecto es un desarrollo secundario del proyecto de código abierto IT-Tools (GPL-3.0). Conserva su base de ingeniería (Vue 3, TypeScript, Vite, Naive UI, pruebas y despliegue) mientras reorganiza el producto en torno al procesamiento de datos.
    
    ## Stack tecnológico
    
    Vue 3 · TypeScript · Vite · Pinia · Naive UI · UnoCSS · vue-i18n · Vitest · Playwright
